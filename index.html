<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игра 18+</title><style>body{background:#161625;color:#fff;font:18px Arial;margin:0}.page{max-width:600px;margin:auto;padding:20px}.box{background:#25253a;border-radius:18px;padding:22px;margin-top:20px}.off{display:none}button{width:100%;margin:8px 0;padding:16px;border-radius:12px;border:1px solid #66628a;background:#34344f;color:#fff;font-size:17px}.go{background:#b193ff;color:#201633;border:0;font-weight:bold}.line{border-bottom:1px solid #55536c;padding:12px 0}.bar{height:9px;background:#45445b;border-radius:8px}.bar span{display:block;background:#b193ff;height:9px;width:0;border-radius:8px}p{color:#cecede;line-height:1.45}</style></head><body><div class="page"><div id="welcome" class="box"><h1>Карта предпочтений 18+</h1><p>Оцените 22 элемента. После нажатия «Начать» появится первый вопрос.</p><p><label><input id="age" type="checkbox"> Мне есть 18 лет</label></p><button class="go" onclick="startGame()">Начать</button><p id="warning" class="off" style="color:#ffadbe">Сначала поставьте галочку 18+.</p></div><div id="play" class="box off"><p id="number"></p><div class="bar"><span id="bar"></span></div><h1 id="title"></h1><p>Как вы это оцениваете?</p><div id="choices"></div><button onclick="choose('Пропущено')">Пропустить</button></div><div id="end" class="box off"><h1>Ваш результат</h1><div id="list"></div><button class="go" onclick="location.reload()">Начать заново</button></div></div><script>var questions=["Куни", "Минет", "Анальные практики", "Поза 69", "Грубый секс", "Нежный секс", "Поцелуи", "Массаж", "Секс-игрушки", "Ролевые сценарии", "Связывание", "Доминирование", "Подчинение", "Интимный флирт в переписке", "Совместный душ", "Зеркала", "Музыка и атмосфера", "Утренний секс", "Спонтанность", "Разговор о желаниях", "Медленный темп", "Интенсивный темп"];var pos=0;var saved=[];function by(id){return document.getElementById(id)}function startGame(){if(!by('age').checked){by('warning').className='';return}by('welcome').className='box off';by('play').className='box';showQuestion()}function showQuestion(){if(pos>=questions.length){finish();return}by('number').innerHTML='Вопрос '+(pos+1)+' из '+questions.length;by('bar').style.width=(pos/questions.length*100)+'%';by('title').innerHTML=questions[pos];var values=['Совсем не нравится','Скорее не нравится','Нейтрально / зависит от ситуации','Скорее нравится','Очень нравится'];var out='';for(var i=0;i<values.length;i++){out+='<button onclick="choose('+i+')">'+values[i]+'</button>'}by('choices').innerHTML=out}function choose(value){saved.push([questions[pos],value]);pos++;showQuestion()}function text(value){if(value==='Пропущено')return value;return ['Совсем не нравится','Скорее не нравится','Нейтрально','Скорее нравится','Очень нравится'][value]}function finish(){by('play').className='box off';by('end').className='box';var out='';for(var i=0;i<saved.length;i++){out+='<div class="line"><b>'+text(saved[i][1])+'</b><br>'+saved[i][0]+'</div>'}by('list').innerHTML=out}</script></body></html>
